name: Szperacz - budowa Windows x64

# Uproszczona wersja joba build-for-windows-flutter z flutter-build.yml (RustDesk 1.5.0):
# tylko Windows x64, bez podpisywania, bez MSI. Wynik: artefakt "Szperacz-windows-x64" z plikiem Szperacz.exe.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/szperacz-publikuj.yml", "**.md"]

permissions:
  contents: write

# Nowsza zmiana anuluje trwającą budowę, żeby starsza wersja nie nadpisała wydania „najnowsza”.
concurrency:
  group: szperacz-windows
  cancel-in-progress: true

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.0"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-windows:
    needs: [generate-bridge]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      # https://github.com/flutter/flutter/issues/155685
      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi
        shell: bash

      - name: Build Szperacz
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res")
          if [ -n "$runner_res" ]; then cp $runner_res ./libs/portable/Runner.res; fi

      # Rozpakowana wersja (folder) na wypadek, gdyby pakowanie do jednego pliku się nie udało.
      - name: Upload Szperacz folder
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Szperacz-windows-x64-folder
          path: rustdesk

      - name: Build self-extracted Szperacz.exe
        shell: bash
        run: |
          set -o pipefail
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          # Błąd trafia też do adnotacji (widocznych bez logowania), żeby łatwo go odczytać.
          if ! python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe > ../../pakowanie.log 2>&1; then
            tail -n 40 ../../pakowanie.log
            echo "::error title=Pakowanie Szperacz.exe::$(grep -iE 'error|failed|cannot|not found' ../../pakowanie.log | tail -n 12 | tr '\n' ' ' | cut -c1-3000)"
            exit 1
          fi
          tail -n 5 ../../pakowanie.log
          popd
          mkdir -p ./Wynik
          ls -la ./target/release/ ./libs/portable/target/release/ 2>/dev/null | grep -i packer || true
          if [ -f ./target/release/rustdesk-portable-packer.exe ]; then
            mv ./target/release/rustdesk-portable-packer.exe ./Wynik/Szperacz.exe
          else
            mv ./libs/portable/target/release/rustdesk-portable-packer.exe ./Wynik/Szperacz.exe
          fi

      - name: Upload Szperacz.exe
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Szperacz-windows-x64
          path: ./Wynik/Szperacz.exe

      # Publiczne wydanie „najnowsza” — pobieranie bez logowania (np. prosto na QNAP).
      - name: Publish Szperacz.exe
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: najnowsza
          name: Szperacz - najnowsza wersja
          body: Szperacz.exe - pomoc zdalna MINITEL (na bazie RustDesk 1.5.0, AGPL-3.0).
          files: ./Wynik/Szperacz.exe
