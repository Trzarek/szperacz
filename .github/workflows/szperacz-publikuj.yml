name: Szperacz - publikacja gotowej budowy

# Jednorazowo publikuje Szperacz.exe z udanej budowy #5 (run 39395964877) jako wydanie „najnowsza”,
# żeby dało się go pobrać bez logowania. Kolejne budowy publikują się same (szperacz-windows.yml).

on:
  push:
    branches: [main]
    paths: [".github/workflows/szperacz-publikuj.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publikuj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz artefakt z budowy #5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Szperacz-windows-x64
          path: ./Wynik
          run-id: 39395964877
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Opublikuj wydanie „najnowsza”
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: najnowsza
          name: Szperacz - najnowsza wersja
          body: Szperacz.exe - pomoc zdalna MINITEL (na bazie RustDesk 1.5.0, AGPL-3.0).
          files: ./Wynik/Szperacz.exe
